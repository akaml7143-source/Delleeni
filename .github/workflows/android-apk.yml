name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Supabase SQL schema
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse and check database schema
        run: |
          python -m pip install --disable-pip-version-check pglast
          python tool/validate_supabase_schema.py
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files when missing
        run: |
          if [ ! -d android/gradle ]; then
            flutter create --platforms=android --project-name=delleeni --org=iq.delleeni --no-pub .
          fi
      - name: Apply Android app manifest
        run: cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Validate optional Supabase build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY is missing while SUPABASE_URL is set."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL is missing while SUPABASE_ANON_KEY is set."
            exit 1
          fi
          if [ -n "$SUPABASE_URL" ]; then
            case "$SUPABASE_URL" in
              https://*.supabase.co) ;;
              *) echo "::error::SUPABASE_URL must be an HTTPS Supabase project URL."; exit 1 ;;
            esac
            if printf '%s' "$SUPABASE_ANON_KEY" | grep -Eqi 'service[_-]?role'; then
              echo "::error::Do not use a service_role key in a mobile application."
              exit 1
            fi
            echo "Supabase public client configuration is present."
          else
            echo "Supabase is not configured; backend-dependent features will remain disabled."
          fi
      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delleeni-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
