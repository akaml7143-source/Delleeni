name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files when missing
        run: |
          if [ ! -d android/gradle ]; then
            flutter create --platforms=android --project-name=delleeni --org=iq.delleeni --no-pub .
          fi
      - name: Apply Android app manifest
        run: cp tool/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delleeni-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
